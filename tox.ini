[tox]
envlist =
    ruff
    mypy
skipsdist = true

[testenv]
allowlist_externals = ruff, mypy
skip_install = true
passenv = *

[testenv:fix]
description = Fix code style issues
commands =
    ruff format bankreader bankreader_demo
    ruff check --fix bankreader bankreader_demo

[testenv:ruff]
commands =
    ruff check bankreader bankreader_demo
    ruff format --check bankreader bankreader_demo

[testenv:mypy]
commands = mypy --pretty --color-output bankreader bankreader_demo
